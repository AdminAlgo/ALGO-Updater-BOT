{% macro logo(size=38) -%}

  <rect x="1" y="1" width="38" height="38" rx="11" fill="#0d1611" stroke="#2fd67a" stroke-opacity=".45"/>
  <path d="M9 29 L17 11 L25 29" fill="none" stroke="#e4efe8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12.6 22.5 H21.4" stroke="#e4efe8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="29.5" cy="15" r="3.1" fill="#2fd67a"/>
  <circle cx="29.5" cy="25" r="3.1" fill="#2fd67a"/>
</svg>
{%- endmacro %}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'dash' %}<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>
{%- elif name == 'tasks' %}<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>
{%- elif name == 'history' %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'reports' %}<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>
{%- elif name == 'members' %}<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9.5" r="2.6"/><path d="M16.5 14.6c2.6.1 4.3 1.8 5 4.4"/>
{%- elif name == 'account' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'pdf' %}<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/>
{%- elif name == 'out' %}<path d="M15 4h4v16h-4M10 16l4-4-4-4M14 12H4"/>
{%- endif %}</svg>
{%- endmacro %}
